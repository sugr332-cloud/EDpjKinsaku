name: bioscan-count

on:
  push:
    branches: [bio-c-core-validation]
  workflow_dispatch:

jobs:
  count-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch exact BioScan baseline
        run: |
          git clone --no-checkout https://github.com/Silarn/EDMC-BioScan.git bioscan
          git -C bioscan checkout --detach 5f0d2e445a95681bf2e85223f883d5c552a7726b
      - name: Run deterministic ruleset count (all 19 genus files)
        run: |
          python scripts/count_bioscan_rulesets.py \
            bioscan/src/bio_scan/bio_data/rulesets/aleoida.py \
            bioscan/src/bio_scan/bio_data/rulesets/anemone.py \
            bioscan/src/bio_scan/bio_data/rulesets/bacterium.py \
            bioscan/src/bio_scan/bio_data/rulesets/brain_tree.py \
            bioscan/src/bio_scan/bio_data/rulesets/cactoida.py \
            bioscan/src/bio_scan/bio_data/rulesets/clypeus.py \
            bioscan/src/bio_scan/bio_data/rulesets/concha.py \
            bioscan/src/bio_scan/bio_data/rulesets/electricae.py \
            bioscan/src/bio_scan/bio_data/rulesets/fonticulua.py \
            bioscan/src/bio_scan/bio_data/rulesets/frutexa.py \
            bioscan/src/bio_scan/bio_data/rulesets/fumerola.py \
            bioscan/src/bio_scan/bio_data/rulesets/fungoida.py \
            bioscan/src/bio_scan/bio_data/rulesets/osseus.py \
            bioscan/src/bio_scan/bio_data/rulesets/recepta.py \
            bioscan/src/bio_scan/bio_data/rulesets/shard.py \
            bioscan/src/bio_scan/bio_data/rulesets/stratum.py \
            bioscan/src/bio_scan/bio_data/rulesets/tubers.py \
            bioscan/src/bio_scan/bio_data/rulesets/tubus.py \
            bioscan/src/bio_scan/bio_data/rulesets/tussock.py \
            | tee bioscan_count.log
      - name: Verify baseline totals (genus_entries=19 species=115 rulesets=254 warnings=0)
        run: |
          # scripts/count_bioscan_rulesets.py counts stratum.py's catalog as 2 genus_entries / 9
          # species, not 1/8: its catalog carries one orphan top-level entry
          # ($Codex_Ent_Stratum_04_Name;, "Stratum Aranaemus", 0 rulesets) duplicating the real,
          # correctly-nested species of the same code ("Stratum Araneamus", 1 ruleset). Confirmed
          # against upstream's own pinned source as a typo/corrupt duplicate, not a 20th genus or
          # species (docs/BIOSCAN_UPSTREAM_DISCREPANCIES.md, BUD-002, CONFIRMED_TYPO) - canonical is
          # 19 genus_entries / 115 species. rulesets is unaffected because the orphan's own ruleset
          # count is 0. The counter script itself is intentionally not changed here (it is a faithful
          # raw reader of upstream's literal catalog structure); the one known duplicate is
          # compensated for here instead, where the discrepancy is already documented.
          bud_002_orphan_genus_entries=1
          bud_002_orphan_species=1
          totals=$(grep '^RESULT' bioscan_count.log \
            | grep -oE '(genus_entries|species|rulesets|warnings)=[0-9]+' \
            | awk -F= '{a[$1]+=$2} END {print a["genus_entries"], a["species"], a["rulesets"], a["warnings"]}')
          read -r raw_genus raw_species rulesets warnings <<< "$totals"
          genus=$((raw_genus - bud_002_orphan_genus_entries))
          species=$((raw_species - bud_002_orphan_species))
          echo "raw totals: genus_entries=$raw_genus species=$raw_species rulesets=$rulesets warnings=$warnings"
          echo "canonical (BUD-002 orphan excluded): genus_entries=$genus species=$species rulesets=$rulesets warnings=$warnings"
          test "$genus" = "19"
          test "$species" = "115"
          test "$rulesets" = "254"
          test "$warnings" = "0"
